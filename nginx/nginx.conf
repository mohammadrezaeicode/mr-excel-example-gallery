server {
    listen 80;

    root /usr/share/nginx/html;

    location / {
        alias /usr/share/nginx/html/static/;
        index index.html;
    }

    location /app/ {
        alias /usr/share/nginx/html/app/;
        try_files $uri $uri/ /app/index.html;
    }
