services:
  frontend:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.nginx
      args:
        MR_EXCEL_VERSION: V8.0.0
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  express-app:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.express
      args:
        MR_EXCEL_VERSION: V8.0.0
    ports:
      - "4000:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  myapp:
    build:
      context: ./excel-validator
      dockerfile: Dockerfile
    expose:
      - "8080"
    ports:
      - "5000:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s